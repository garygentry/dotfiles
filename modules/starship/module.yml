name: starship
description: "Install Starship cross-shell prompt with custom configuration"
version: "1.1.0"
priority: 45
dependencies: []
os:
  - macos
  - ubuntu
  - arch
requires:
  - curl
prompts:
  - key: starship_preset
    message: "Starship prompt preset (custom = dotfiles curated config)"
    default: "custom"
    type: choice
    options:
      - custom
      - no-nerd-font
      - plain-text
      - pure-preset
      - tokyo-night
      - catppuccin-powerline
      - gruvbox-rainbow
      - jetpack
      - onehalf-dark
      - pastel-powerline
      - bracketed-segments
      - solarized-osaka
    show_when: explicit_install
tags:
  - shell
  - prompt
