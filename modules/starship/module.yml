name: starship
description: "Install Starship cross-shell prompt with custom configuration"
version: "1.1.0"
priority: 45
dependencies: []
os:
  - macos
  - ubuntu
  - arch
requires:
  - curl
prompts:
  - key: starship_preset
    message: "Starship prompt preset (official starship presets)"
    default: "nerd-font-symbols"
    type: choice
    options:
      - nerd-font-symbols
      - no-nerd-font
      - plain-text-symbols
      - pure-preset
      - tokyo-night
      - catppuccin-powerline
      - gruvbox-rainbow
      - jetpack
      - pastel-powerline
      - bracketed-segments
      - no-runtime-versions
      - no-empty-icons
    show_when: explicit_install
legacy_paths:
  - path: "~/.config/starship.toml"
    action: backup
    reason: "Will be replaced by managed starship config"
tags:
  - shell
  - prompt
