name: yazi
description: "yazi terminal file manager (yazi + ya), sudo-free: mise-declared or the upstream release binary"
version: "1.0.0"
priority: 50            # after mise (45) in the same dependency level: with modules.yazi.tools set, its lockfile must be in place first
dependencies: []
os:
  - macos
  - ubuntu
  - arch
requires:
  - curl
tags:
  - cli
  - tui
notes:
  - "Ships no config. Deploy ~/.config/yazi/{yazi,keymap,theme}.toml from a content overlay; package.toml must be a copy (`ya pkg` rewrites it). See modules/yazi/README.md."
