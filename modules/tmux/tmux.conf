# ==========================================
# TL;DR: Tmux Configuration
# Prefix: Ctrl-j or Ctrl-f
# Reload: Prefix + r
# ==========================================

# --- Initial Setup & Performance ---
set -g default-terminal "xterm-256color"
set -as terminal-features ",xterm-256color:RGB" # True color support
set -g status-keys vi
set -g history-limit 10000                      # Increase scrollback from 2k to 10k
set -sg escape-time 0                           # No delay for escape key press
set-option -g repeat-time 300                   # Allow short window for repeating commands
set -g mouse on                                 # Enable mouse support

# --- Prefix Configuration ---
set-option -g prefix C-j
set-option -g prefix2 C-f
unbind-key C-j
bind-key C-j send-prefix

# --- Window & Pane Indexing ---
set -g base-index 1                             # Start windows at 1
set -g pane-base-index 1                        # Start panes at 1
set-window-option -g pane-base-index 1
set -g renumber-windows on                      # Automatically renumber windows when one closes

# --- Navigation & Splits ---

# Smart splits (opens in current directory)
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Alt-arrow keys (No prefix) to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift-arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Reorder windows with CTRL+SHIFT+Arrow
bind-key -n C-S-Left swap-window -t -1 \; select-window -t -1
bind-key -n C-S-Right swap-window -t +1 \; select-window -t +1

# Resize panes (Prefix + H, J, K, L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- vim-tmux-navigator ---
# Seamless Ctrl+h/j/k/l navigation between nvim splits and tmux panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# --- Utility Commands ---

# Synchronize panes toggle
bind-key y set-window-option synchronize-panes\; display-message "Synchronize mode toggled."

# Easy config reload
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Improved Clear History (Prefix + L)
bind L send-keys C-l \; run 'sleep 0.1' \; clear-history

# --- Copy Mode (Vi Style) ---
setw -g mode-keys vi
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Clipboard integration (Linux/X11)
# Note: If on macOS, change "xclip -selection clipboard -i" to "pbcopy"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# --- Visuals & Status Bar ---

# Title & Renaming
set-window-option -g automatic-rename on
set-option -g set-titles on

# Message display time
set-option -g display-time 3000
set-option -g display-panes-time 3000

# Activity Monitoring
setw -g monitor-activity on
set -g visual-activity off
set -g bell-action none
setw -g monitor-bell off
set -g activity-action none

# --- Catppuccin Mocha Theme ---
# Install: git clone https://github.com/catppuccin/tmux ~/.config/tmux/plugins/catppuccin/tmux
#          or via TPM: set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

# Window look & feel
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_default_fill "none"
set -g @catppuccin_window_current_fill "all"


# Status bar modules
set -g @catppuccin_status_modules_right "session host date_time"
set -g @catppuccin_status_modules_left ""
set -g @catppuccin_date_time_text "%H:%M"
set -g @catppuccin_status_justify "centre"

# Load the plugin (must come AFTER all @catppuccin_ options)
# run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# --- TPM Plugin Manager ---
# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'