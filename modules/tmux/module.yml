name: tmux
description: Terminal multiplexer with TPM plugin manager
version: 1.0.0
priority: 35
dependencies: []
os: []
prompts:
  - key: tmux_config
    message: "Tmux config preset (opinionated = prefix Ctrl-j/f, vi keys, theme)"
    default: "opinionated"
    type: choice
    options:
      - opinionated
      - minimal
    show_when: explicit_install
legacy_paths:
  - path: "~/.tmux.conf"
    action: backup
    reason: "Shadows XDG config (~/.config/tmux/tmux.conf) on tmux 3.1+"
tags:
  - terminal
  - productivity
