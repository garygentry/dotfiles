name: pi
description: "Install the pi coding agent CLI (pinned, sudo-free npm global)"
version: "1.0.0"
priority: 50            # installs the CLI; an overlay pi-config adapter (priority 60) wires resources
dependencies:
  - nodejs              # engine module: guarantees a runnable node/npm (and pi's engines.node floor)
os:
  - macos
  - ubuntu
  - arch
requires:
  - npm
tags:
  - ai
  - cli
notes:
  - "Run 'pi' once interactively to authenticate."
  - "Pin modules.pi.version. A manual 'pi update' is corrected back to the pin on the next install. See modules/pi/README.md."
