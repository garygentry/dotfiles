name: lazygit
description: "TUI for git with interactive interface (sudo-free: mise-declared or the upstream release binary)"
version: "2.0.0"
priority: 35
dependencies:
  - git
os: []
tags:
  - git
  - tui
notes:
  - "Optional modules.lazygit.tools: a map of tool to EXACT, QUOTED version (e.g. lazygit: \"0.65.1\"). When set, the module declares it in ~/.config/mise/conf.d/lazygit.toml, installs it through mise (needs the mise module) and removes its own release install. When mise has no build for this platform (a lockfile without one), it falls back to the no-tools path below."
  - "Without tools: Homebrew on macOS when present, else the upstream release tarball into ~/.local/share/lazygit, linked from ~/.local/bin, verified against the release's checksums.txt (no checksum = fail, unless DOTFILES_ALLOW_UNVERIFIED=1). Installs when no runnable lazygit is found; DOTFILES_LAZYGIT_VERSION (default: latest) also reinstalls this module's own copy at a different version. No sudo, no system package."
  - "Ships no config. Deploy ~/.config/lazygit/config.yml from a content overlay."
