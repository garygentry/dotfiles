name: lazygit
description: "TUI for git with interactive interface (sudo-free: mise-declared or the upstream release binary)"
version: "2.0.0"
priority: 35
dependencies:
  - git
os: []
tags:
  - git
  - tui
notes:
  - "Optional modules.lazygit.tools: a map of tool to EXACT, QUOTED version (e.g. lazygit: \"0.65.1\"). When set, the module declares it in ~/.config/mise/conf.d/lazygit.toml and installs it through mise (needs the mise module)."
  - "Without tools: Homebrew on macOS when present, else the upstream release tarball into ~/.local/bin, verified against the release's checksums.txt. Pin with DOTFILES_LAZYGIT_VERSION (default: latest). Only installs when the binary is missing. No sudo, no system package."
  - "Ships no config. Deploy ~/.config/lazygit/config.yml from a content overlay."
