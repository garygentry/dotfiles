name: neovim
description: "Install Neovim and symlink configuration"
version: "1.0.0"
priority: 50
dependencies:
  - git
os:
  - macos
  - ubuntu
  - arch
requires: []
files:
  - source: init.lua
    dest: "~/.config/nvim/init.lua"
    type: symlink
prompts: []
legacy_paths:
  - path: "~/.config/nvim/init.vim"
    action: prompt
    reason: "Vimscript config conflicts with managed Lua config (init.lua)"
  - path: "~/.vimrc"
    action: warn
    reason: "Neovim no longer reads ~/.vimrc by default, but Vim still uses it"
tags:
  - editor
  - development
