name: neovim
description: "Install Neovim (binary only; bring your own config)"
version: "1.1.0"
priority: 50
dependencies:
  - git
os:
  - macos
  - ubuntu
  - arch
requires:
  - ripgrep
files: []
prompts: []
legacy_paths:
  - path: "~/.config/nvim/init.vim"
    action: prompt
    reason: "Vimscript config conflicts with managed Lua config (init.lua)"
  - path: "~/.vimrc"
    action: warn
    reason: "Neovim no longer reads ~/.vimrc by default, but Vim still uses it"
tags:
  - editor
  - development
