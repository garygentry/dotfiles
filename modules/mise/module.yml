name: mise
description: "mise: pinned, checksum-verified CLI tools and language runtimes in user space (opt-in; declare tools in config)"
version: "1.0.0"
priority: 45            # before runtimes (50) at the same dependency level; shim precedence doesn't depend on module order
dependencies: []
os:
  - macos
  - ubuntu
  - arch
requires:
  - curl
files:
  # Marker: gates the zsh module's mise handling (shims first + activate) on THIS module
  # being installed, not on a mise shims dir merely existing. Deployed by the engine, so
  # uninstall/prune removes it and zsh stops treating mise as dotfiles-managed.
  - source: dotfiles-managed
    dest: "~/.config/mise/.dotfiles-managed"
    type: copy
tags:
  - cli
  - programming
notes:
  - "Pin modules.mise.version. Tools are declared in config, not by this module; see modules/mise/README.md."
  - "systemd units and cron entries don't read shell rc files. Call tools by absolute path or via `~/.local/bin/mise exec -- <cmd>`."
