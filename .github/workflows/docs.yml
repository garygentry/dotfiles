# .github/workflows/docs.yml — GitHub Pages deploy (project Pages, subpath base)
# Generated by doc-site. Env-driven SITE/BASE_PATH (REQ-CORE-02/DEPLOY-02).
#
# Single-package docs site living in docs-site/ (no root package.json/workspaces),
# so the install and build steps are scoped with `working-directory: docs-site`
# and use plain `npm ci` / `npm run build` instead of the `--workspace` form.
#
# `${{ ... }}` sequences are GitHub Actions expressions, NOT generator tokens.
name: docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs-site/**"
      - "docs/**"
      - "docs-site/docs.manifest.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: docs-site

      - name: Build docs site
        run: npm run build
        working-directory: docs-site
        env:
          # Env-driven site/base — consumed by the docs package astro.config.mjs.
          # Subpath base => assets resolve on the project Pages subpath /<repo>/.
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Docs drift guard
        run: sh setup-docs.sh && npm run docs:check
        working-directory: docs-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs-site/dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
