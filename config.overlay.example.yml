# Example content overlay.
#
# Copy this to your content directory as config.yml to personalize a dotfiles
# install WITHOUT editing the generic repo. The content directory is opt-in: the
# engine uses it only when DOTFILES_CONTENT_DIR points at it. A typical setup:
#
#   mkdir -p ~/.config/dotfiles
#   cp config.overlay.example.yml ~/.config/dotfiles/config.yml
#   # edit to taste, then make it apply to every install:
#   echo 'export DOTFILES_CONTENT_DIR="$HOME/.config/dotfiles"' >> ~/.zshenv
#
# This overlay is deep-merged over the repo's config.yml: only include the keys
# you want to change. Scalars override the base when set; module settings merge
# per key (so you can change one modules.<name>.<key> without redefining the
# whole module). When no content directory exists, the engine behaves exactly as
# it does with the committed config.yml alone.
#
# The content directory can also carry its own profiles/ and modules/, laid out
# just like the repo:
#
#   ~/.config/dotfiles/
#     config.yml            # this file
#     profiles/mine.yml     # a content profile (wins over a same-name built-in)
#     modules/mymod/        # a CUSTOM module (module.yml, install.sh, ...)
#     modules/git/          # an OVERRIDE of the built-in git module (same name)
#
# Module discovery scans the engine's modules/ then your content modules/, with
# same-name CONTENT-WINS precedence: a content module.yml of the same name
# replaces the built-in one wholesale (whole-module replacement, not merging).
# A content profile can then list custom or overridden modules by name, and
# `dotfiles list`/`status` tag each module built-in / override / custom.
#
# A complete, copy-me example content repo (this config.yml + a profile + a
# custom module + an override) lives at docs/examples/content-repo/. The full
# two-repo model and clean-machine first-install flow are documented in
# docs/content-overlay.md.

# Personal identity used by modules like git and ssh.
user:
  name: "Ada Lovelace"
  email: "ada@example.com"
  github_user: "ada"

# Opt into a secret provider for this machine.
secrets:
  provider: 1password
  account: my.1password.com

modules:
  ssh:
    # Use an external SSH agent (e.g. the 1Password agent) instead of a local key.
    key_source: agent
    # When key_source=1password, point at your own 1Password item. The key type
    # (ed25519/rsa) is appended as the field. Defaults to "op://Private/SSH Key".
    # key_item: op://Private/My SSH Key
