# Generic, conservative defaults meant to work for the widest audience out of
# the box. Personal or machine-specific settings belong in your content overlay
# (an optional ~/.config/dotfiles/config.yml), NOT here — see
# config.overlay.example.yml. The overlay is deep-merged over this file, so it
# only needs the keys you want to change.
profile: developer

secrets:
  # No secret provider by default, so installs need no external tooling. Opt in
  # from your overlay (e.g. provider: 1password) or DOTFILES_SECRETS_PROVIDER.
  provider: noop

user:
  name: ""
  email: ""
  github_user: ""

modules:
  ssh:
    key_type: ed25519
    # How SSH keys are managed:
    #   generate  (default) create a local key if none exists
    #   agent     use an external SSH agent (e.g. 1Password); no local key,
    #             and the GitHub config avoids pinning IdentityFile/IdentitiesOnly
    #   1password retrieve the key from 1Password via the `op` CLI
    #   none      leave ~/.ssh keys and config untouched
    key_source: generate
  git:
    default_branch: main
  zsh:
    theme: powerlevel10k
  neovim:
    colorscheme: catppuccin
